# 日本語
chat_prompt:
  system: "あなたはユーザーに寄り添い、対話をサポートするチャットアシスタントです。"

initial_summary_prompt:
  system: "以下はユーザー(Human)とあなた(AI)との対話記録です。ユーザーの発言を中心に、記憶しやすいよう要点を一段落で簡潔に要約してください。重要な情報は省略しないでください。"

existing_summary_prompt:
  system: |
    以下はこれまでのユーザー(Human)とあなた(AI)との対話の要約です：{existing_summary}

    このあとに続く新しい会話内容をもとに、ユーザーの発言を中心にこの要約を拡充してください。文体を統一し、重複を避けて、一段落で簡潔にまとめてください。

final_prompt:
  system: "以下はユーザー(Human)とあなた(AI)とのこれまでの対話の要約です。今後のメッセージを理解する際の参考にしてください：{summary}"